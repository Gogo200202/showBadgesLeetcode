<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetCode Badges — Gogo200202</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(12px, 3vw, 40px);
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      .showCase {
        display: flex;
        flex-direction: column;
        gap: clamp(20px, 4vh, 56px);
        width: 100%;
        max-width: 1600px;
        max-height: 100%;
        overflow-y: auto;
        padding: clamp(16px, 3vw, 48px);
        border-radius: 1rem;
      }
      .showCase > div:first-child {
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 2vh, 24px);
      }
      .header {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.5vw, 20px);
        flex-wrap: wrap;
        font-size: clamp(1.6rem, 4.5vw, 3.6rem);
        font-weight: 700;
      }
      .header img {
        width: clamp(32px, 5vw, 72px);
        height: auto;
      }
      hr {
        border: 0;
        width: 100%;
        height: clamp(2px, 0.4vh, 4px);
        margin: 0;
      }
      .category {
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 2vh, 28px);
      }
      .category p {
        margin: 0;
        font-size: clamp(1.3rem, 3vw, 2.6rem);
        font-weight: 700;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: clamp(16px, 2.5vw, 40px);
      }
      .badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(4px, 0.8vh, 10px);
        text-align: center;
        padding: clamp(6px, 1vw, 14px);
        border-radius: 12px;
      }
      .badge img {
        width: clamp(110px, 15vw, 260px);
        height: auto;
      }
      .badge p {
        margin: 0;
        font-size: clamp(0.95rem, 1.9vw, 1.7rem);
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .badge h6 {
        margin: 0;
        font-size: clamp(0.8rem, 1.4vw, 1.3rem);
        font-weight: 600;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <!--BADGES:START-->
    <div class="showCase" style="background-color: #000; border: none">
      <div>
        <span class="header" style="color: #efefef"
          ><img
            src="logo.webp"
            alt="LeetCode Logo"
            title="LeetCode Logo"
            width="36"
            height="36"
          /><span>Gogo200202 LeetCode Badges</span></span
        >
        <hr style="background-color: #fff" />
      </div>
      <div class="category">
        <p id="title" style="color: #fff">Annual Medals</p>
        <div class="grid">
          <div class="badge">
            <img
              src="https://assets.leetcode.com/static_assets/others/50.gif"
              alt="50 Days Badge 2026"
              title="50 Days Badge 2026"
            />
            <p style="color: #efefef">50 Days Badge 2026</p>
            <h6 style="color: #fff">2026-09-19</h6>
          </div>
          <div class="badge">
            <img
              src="https://assets.leetcode.com/static_assets/marketing/2024-50.gif"
              alt="50 Days Badge 2024"
              title="50 Days Badge 2024"
            />
            <p style="color: #efefef">50 Days Badge 2024</p>
            <h6 style="color: #fff">2024-06-03</h6>
          </div>
        </div>
      </div>
    </div>
    <!--BADGES:END-->
  </body>
</html>
